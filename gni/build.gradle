apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    buildToolsVersion '30.0.3'

    ndkVersion '22.1.7171670'

    defaultConfig {
        minSdkVersion 15
        targetSdkVersion 33

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    namespace 'com.librarywrapper.core'
}


allprojects {
    repositories {
        mavenCentral()
        google()
        jcenter()
    }
}


dependencies {
    implementation 'com.android.tools.lint:lint-gradle:31.8.0'
}